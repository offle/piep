<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>piep Impressum</title>
  <meta name="description" content="Impressum fuer die iOS-App piep und die Supportseite piep.offle.de.">
  <style>
    :root {
      --bg: #f4f1e8;
      --card: rgba(255, 252, 244, 0.82);
      --text: #1f2a1f;
      --muted: #5d685d;
      --line: rgba(31, 42, 31, 0.12);
      --accent: #2f6f59;
      --accent-strong: #1f5342;
      --shadow: 0 24px 80px rgba(31, 42, 31, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(122, 164, 120, 0.28), transparent 28%),
        radial-gradient(circle at bottom right, rgba(230, 193, 118, 0.26), transparent 28%),
        linear-gradient(180deg, #faf7ef 0%, var(--bg) 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero {
      padding: 40px 32px 24px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(47, 111, 89, 0.14), rgba(230, 193, 118, 0.12)),
        transparent;
    }

    .eyebrow {
      margin: 0 0 12px;
      font: 600 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 0.98;
      font-weight: 700;
    }

    h2 {
      margin: 0;
      font: 700 1.1rem/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .content {
      padding: 28px 32px 32px;
      display: grid;
      gap: 18px;
    }

    .box {
      display: grid;
      gap: 10px;
      padding: 20px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.46);
    }

    .label {
      margin: 0;
      font: 600 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .imprint-data {
      margin: 0;
      white-space: pre-wrap;
      font: 1.08rem/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .note {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.98rem;
    }

    a {
      color: var(--accent-strong);
      font-weight: 700;
      text-decoration: none;
      word-break: break-word;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer {
      padding: 0 32px 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 640px) {
      .hero,
      .content,
      .footer {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="hero">
      <p class="eyebrow">piep</p>
      <h1>Impressum</h1>
    </section>

    <section class="content">
      <div class="box">
        <p class="label">Angaben gemaess § 5 DDG</p>
        <pre id="provider" class="imprint-data">Impressumsdaten werden geladen...</pre>
      </div>

      <div class="box">
        <p class="label">Kontakt</p>
        <p class="note">
          E-Mail: <a href="mailto:offlepoffle1@icloud.com">offlepoffle1@icloud.com</a>
        </p>
      </div>

      <div class="box">
        <p class="label">Verantwortlich fuer den Inhalt nach § 18 Abs. 2 MStV</p>
        <pre id="responsible" class="imprint-data">Impressumsdaten werden geladen...</pre>
      </div>
    </section>

    <div class="footer">
      <a href="index.html">Zurueck zu Kontakt und Support</a>
    </div>
  </main>

  <script>
    async function loadImprint() {
      const targets = [
        document.getElementById("provider"),
        document.getElementById("responsible")
      ];

      try {
        const response = await fetch("IMPRINT.md", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("IMPRINT.md konnte nicht geladen werden.");
        }

        const text = (await response.text()).trim();
        if (!text) {
          throw new Error("IMPRINT.md ist leer.");
        }

        for (const target of targets) {
          target.textContent = text;
        }
      } catch (error) {
        for (const target of targets) {
          target.textContent =
            "Impressumsdaten sind derzeit nicht verfuegbar. Bitte kontaktiere offlepoffle1@icloud.com.";
        }
      }
    }

    loadImprint();
  </script>
</body>
</html>
